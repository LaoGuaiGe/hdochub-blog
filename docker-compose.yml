version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: hdochub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: hdochub_dev_2026
      MYSQL_DATABASE: hdochub_blog
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - hdochub-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: hdochub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - hdochub-redis-data:/data

volumes:
  hdochub-mysql-data:
  hdochub-redis-data:
