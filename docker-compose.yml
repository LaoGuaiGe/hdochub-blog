version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: hdochub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: hdochub_dev_2026
      MYSQL_DATABASE: hdochub_blog
    ports:
      - "3307:3306"
    volumes:
      - hdochub-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-phdochub_dev_2026"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: hdochub-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - hdochub-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

volumes:
  hdochub-mysql-data:
  hdochub-redis-data:
